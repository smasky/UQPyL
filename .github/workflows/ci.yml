name: CI

on:
  push:
    branches:
      - "**"
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel with isolated dependencies
        env:
          CFLAGS: ${{ runner.os == 'Linux' && '-Werror=incompatible-pointer-types' || '' }}
        run: |
          python -m build --wheel --outdir dist

      - name: Test installed wheel in a fresh environment
        env:
          PYTHONUTF8: "1"
        run: |
          python .github/scripts/test_wheel.py --wheel-dir dist --report-dir .cache/wheel-test

      - name: Upload wheel and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-test-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.whl
            .cache/wheel-test/*.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .cache/wheel-test/coverage.xml
          fail_ci_if_error: false
