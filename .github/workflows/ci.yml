name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

jobs:
  tests:
    # Only run automatically when the HEAD commit message contains "CI".
    # Example: git commit -m "CI: update tests"
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'CI') }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install pytest pytest-cov
          # Build requirements + runtime deps (setup.py imports numpy/scipy/pybind11/Cython)
          python -m pip install numpy scipy Cython pybind11
          python -m pip install prettytable h5py xarray netcdf4 h5netcdf

      - name: Build native extensions (in-place)
        run: |
          python setup.py build_ext --inplace

      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q --cov=UQPyL --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

