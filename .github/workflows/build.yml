name: Publish tested distributions to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag, for example v2.1.7
        required: true
        type: string
      source_run_id:
        description: Successful CI run ID (blank selects a matching successful run)
        required: false
        type: string
      publish:
        description: Upload verified artifacts to PyPI (false only verifies them)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: pypi-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - name: Check tag and version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python .github/scripts/release_artifacts.py version
      - name: Resolve a successful CI run for this exact commit
        id: source
        env:
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
        uses: actions/github-script@v7
        with:
          script: |
            const {selectRun} = require('./.github/scripts/select_release_run.cjs');
            const sha = (await exec.getExecOutput('git', ['rev-parse', 'HEAD'])).stdout.trim();
            const selected = await selectRun({github, ...context.repo, sha,
              requestedRunId: process.env.REQUESTED_RUN_ID || ''});
            core.setOutput('run_id', String(selected.id));
            core.info(`Reusing ${selected.html_url}`);
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify source, version, matrix and hashes
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python .github/scripts/release_artifacts.py verify --directory candidate

  publish:
    needs: prepare
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uqpyl
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Recheck downloaded bytes before upload
        env:
          SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python .github/scripts/release_artifacts.py verify --directory candidate
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: candidate/dist/
