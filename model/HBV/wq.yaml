version: general

basic:
  projectPath: "E:/apex_bian/Txt_runoff"
  workPath: "E:/Apex_workPath"
  command: "APEX1501_rel32.exe"
  parallel: 1
  timeout: 600

parameters:
  library: "paraLibrary.yaml"
  params: "ds_param_quality.yaml"
  hardBound: True

functions:
  - name: R2
    kind: builtin
    args: [sim, obs]

series:
  - id: runoff
    desc: RUNOFF
    size: 108
    cache: True
    sim:
      file: "SITE713.RCH"
      rowRanges: 
        - [26400, 102925, 714]
      colSpan: [76, 86]

  - id: yono
    desc: YONO
    size: 108
    cache: True
    sim:
      file: "SITE713.RCH"
      rowRanges: 
        - [26400, 102925, 714]
      colSpan: [160, 170]
  
  - id: no3o
    desc: NO3O
    size: 108
    cache: True
    sim:
      file: "SITE713.RCH"
      rowRanges: 
          - [26400, 102925, 714]
      colSpan: [208, 218]
  
  - id: nh4o
    desc: NH4O
    size: 108
    cache: True
    sim: 
      file: "SITE713.RCH"
      rowRanges: 
          - [26400, 102925, 714]
      colSpan: [232, 242]
  
  - id: no2o
    desc: NO2O
    size: 108
    cache: True
    sim: 
      file: "SITE713.RCH"
      rowRanges: 
          - [26400, 102925, 714]
      colSpan: [256, 266]
  
  - id: tn
    desc: TN
    size: 108
    cache: True
    sim:
      expr: "yono_sim + no3o_sim + no2o_sim + nh4o_sim"
    obs:
      file: "TN_obs.txt"
      rowRanges:
        - [1, 108]
      colNum: 1

derived:
  - id: tn_r2
    desc: TN_R2
    call:
      func: R2
      args:
        sim : tn_sim
        obs : tn_obs

objectives:
  use : [o1]
  items :
    - id: o1
      desc: TN_NSE
      sense: max
      ref: tn_r2
    
reporter:
  flush_interval: 10
  scalars:
    - o1
  series:
    - tn_sim