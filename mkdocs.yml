site_name: UQPyL
theme:
  name: material
  highlight: monokai
nav:
  - Introduction: index.md
  - Quick Start: quick_start.md
  - Advancing: advancing.md
  - Tutorial: tutorial.md
  - Examples Collection: examples.md
  - API Reference: api_reference.md
  - ChangLog: chang_log.md

extra_css:
  - css/nav_.css
  - css/head_.css
  - css/content_.css

markdown_extensions:
  - pymdownx.emoji
  - pymdownx.superfences
  - pymdownx.arithmatex

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML

site_url: https://UQPyL.readthedocs.io/
repo_url: https://github.com/smasky/UQPyL