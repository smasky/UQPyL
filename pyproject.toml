[build-system]
requires = [
    "setuptools",
    "wheel",
    "Cython>=3.1",
    "pybind11>=3.0",
    "numpy>=1.21",
    "scipy",
]

build-backend = "setuptools.build_meta"

[project]
name = "UQPyL"
version = "2.1.7"
authors = [
    {name = "wmtSky", email = "wmtsky@hhu.edu.cn"}
]
license = {text = "MIT"}
description = "A python package for parameter uncertainty quantification and optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
viz = ["matplotlib", "seaborn"]
dev = ["pytest", "ruff==0.16.8"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["UQPyL/surrogate/mars/core", "UQPyL/surrogate/svr/core", "agent", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F821", "F822", "F823"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.urls]
Homepage = "https://uqpyl.readthedocs.io"
Repository = "https://github.com/smasky/UQPyL"
Documentation = "https://uqpyl.readthedocs.io"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["pp*", "*-musllinux*"]
build-verbosity = 1

[tool.pytest.ini_options]
markers = [
  "numerical: reviewed numerical reference, invariant, or held-out accuracy checks (not an exhaustive correctness label)",
  "statistical: empirical sampling moment/distribution checks with fixed seeds and finite-sample tolerances",
]
testpaths = ["tests"]
cache_dir = ".cache/pytest/cache"
python_files = ["test_*.py"]
norecursedirs = [
  "examples",
  "build",
  "Result",
  ".history",
  ".ipynb_checkpoints",
  ".cache",
  ".pytest_cache",
]
addopts = "-ra --basetemp=.cache/pytest/tmp"
filterwarnings = [
  "ignore:The truth value of an empty array is ambiguous.*:DeprecationWarning",
  "ignore:The NumPy module was reloaded.*:UserWarning",
  "ignore:numpy\\.ndarray size changed.*:RuntimeWarning",
]
